<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Squish It! Spelling</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin:0; overflow-x:hidden; font-family: "Chalkboard SE", "Comic Sans MS", "Marker Felt", sans-serif;
         background: linear-gradient(160deg,#ffd6ec,#d6ecff); min-height:100vh; color:#3a2a5a; text-align:center; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 18px 14px 40px; }
  h1 { font-size: 40px; margin: 6px 0 2px; color:#c2185b; text-shadow: 2px 2px 0 #fff; }
  .sub { font-size: 18px; margin-bottom: 14px; }
  .stars { font-size: 26px; margin: 6px 0 12px; min-height: 34px; }
  .card { background:#fff; border-radius: 26px; padding: 20px 16px; box-shadow: 0 6px 0 #e0b7d6; margin-bottom: 16px; }
  .big { font-size: 34px; margin: 8px 0; }
  .prompt { font-size: 30px; color:#6a1b9a; margin: 6px 0 4px; }
  .hint { font-size: 17px; color:#7a6a9a; min-height: 22px; }
  .answer { min-height: 70px; font-size: 44px; letter-spacing: 4px; border-bottom: 4px dashed #c2185b; margin: 12px 8px 16px; padding-bottom: 4px; }
  .tiles { display:flex; flex-wrap:wrap; justify-content:center; gap:10px; }
  button { font-family: inherit; border: none; cursor: pointer; }
  .tile { width: 62px; height: 62px; font-size: 34px; border-radius: 16px; background:#ffe082; box-shadow: 0 5px 0 #f9a825; color:#3a2a5a; }
  .tile.apos { background:#b2ebf2; box-shadow: 0 5px 0 #26a69a; font-size: 40px; }
  .tile:disabled { opacity: .25; }
  .row { display:flex; justify-content:center; gap: 12px; margin-top: 18px; flex-wrap: wrap; }
  .btn { font-size: 22px; padding: 14px 22px; border-radius: 18px; color:#fff; background:#ab47bc; box-shadow: 0 5px 0 #6a1b9a; }
  .btn.green { background:#43a047; box-shadow: 0 5px 0 #1b5e20; }
  .btn.blue { background:#1e88e5; box-shadow: 0 5px 0 #0d47a1; }
  .btn.pink { background:#ec407a; box-shadow: 0 5px 0 #ad1457; }
  .btn.big2 { font-size: 30px; padding: 22px 26px; width: 100%; margin: 8px 0; }
  .feedback { font-size: 30px; min-height: 42px; margin-top: 12px; }
  .hide { display:none; }
  .rule { font-size: 19px; line-height: 1.45; text-align:left; }
  .pop { animation: pop .35s ease; }
  @keyframes pop { 0%{transform:scale(1)} 50%{transform:scale(1.25)} 100%{transform:scale(1)} }
  .shake { animation: shake .4s ease; }
  @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-10px)} 75%{transform:translateX(10px)} }
</style>
</head>
<body>
<div class="wrap">
  <h1>Squish It!</h1>
  <div class="sub">Unit 2, Lesson 11 spelling</div>
  <div class="stars" id="stars"></div>

  <!-- MENU -->
  <div id="menu" class="card">
    <div class="rule">
      <b>The secret:</b> an apostrophe ( <b>'</b> ) is where letters got <b>squished out</b>.<br>
      is + not = isn<b>'</b>t &nbsp; (the <b>o</b> got squished!)<br>
      <b>Trap word:</b> <i>their</i> has NO squish. It means something belongs to them: <i>their dog</i>.
    </div>
    <button class="btn big2 pink" onclick="startGame('squish')">🍪 Squish It!<br><span style="font-size:18px">build the short word</span></button>
    <button class="btn big2 blue" onclick="startGame('listen')">🎧 Listen &amp; Spell<br><span style="font-size:18px">hear it, then spell it</span></button>
    <button class="btn big2 green" onclick="startGame('trap')">🪤 Squish or No Squish?<br><span style="font-size:18px">catch the trap word</span></button>
  </div>

  <!-- SPELL GAMES -->
  <div id="game" class="card hide">
    <div class="hint" id="roundInfo"></div>
    <div class="prompt" id="prompt"></div>
    <div class="hint" id="hint"></div>
    <div class="answer" id="answer"></div>
    <div class="tiles" id="tiles"></div>
    <div class="row">
      <button class="btn" onclick="undo()">⬅ Oops</button>
      <button class="btn blue" id="hearBtn" onclick="sayCurrent()">🔊 Hear it</button>
      <button class="btn green" onclick="check()">✔ Check</button>
    </div>
    <div class="feedback" id="feedback"></div>
    <div class="row"><button class="btn pink" onclick="toMenu()">🏠 Menu</button></div>
  </div>

  <!-- TRAP GAME -->
  <div id="trap" class="card hide">
    <div class="hint" id="trapInfo"></div>
    <div class="big" id="trapWord"></div>
    <div class="hint">Does this word NEED a squish ( ' )?</div>
    <div class="row">
      <button class="btn big2 pink" onclick="trapAnswer(true)">🍪 SQUISH!</button>
      <button class="btn big2 green" onclick="trapAnswer(false)">🚫 NO SQUISH!</button>
    </div>
    <div class="feedback" id="trapFeedback"></div>
    <div class="row"><button class="btn pink" onclick="toMenu()">🏠 Menu</button></div>
  </div>

  <!-- DONE -->
  <div id="done" class="card hide">
    <div class="big">🎉 You did it! 🎉</div>
    <div class="prompt" id="doneScore"></div>
    <div class="hint" id="bestScore"></div>
    <div class="row">
      <button class="btn green" onclick="startGame(mode)">Play again</button>
      <button class="btn pink" onclick="toMenu()">🏠 Menu</button>
    </div>
  </div>
</div>

<script>
const WORDS = [
  {w:"it's",   long:"it is",   say:"it's, as in, it's my turn",       out:"i"},
  {w:"that's", long:"that is", say:"that's, as in, that's my dog",     out:"i"},
  {w:"she's",  long:"she is",  say:"she's, as in, she's my friend",    out:"i"},
  {w:"isn't",  long:"is not",  say:"isn't, as in, it isn't raining",   out:"o"},
  {w:"aren't", long:"are not", say:"aren't, as in, we aren't late",    out:"o"},
  {w:"wasn't", long:"was not", say:"wasn't, as in, it wasn't me",      out:"o"},
  {w:"I'll",   long:"I will",  say:"I'll, as in, I'll help you",        out:"w and i"},
  {w:"you'll", long:"you will",say:"you'll, as in, you'll love it",    out:"w and i"},
  {w:"she'll", long:"she will",say:"she'll, as in, she'll be here soon",out:"w and i"},
  {w:"their",  long:null,      say:"their, as in, their dog is fluffy. Their is the trap word",out:null},
];
var mode = null, queue = [], idx = 0, built = [], used = [], score = 0, tries = 0;

function shuffle(a){ a = a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function $(id){ return document.getElementById(id); }
function speak(t){ try{ speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(t); u.rate=0.85; u.pitch=1.1; speechSynthesis.speak(u);}catch(e){} }
function show(id){ ["menu","game","trap","done"].forEach(x=>$(x).classList.toggle("hide", x!==id)); }
function drawStars(){ $("stars").textContent = "⭐".repeat(score); }
function toMenu(){ show("menu"); }

function startGame(m){
  mode = m; score = 0; idx = 0; drawStars();
  if(m === "trap"){ queue = shuffle(buildTrapRound()); show("trap"); nextTrap(); return; }
  queue = m === "squish" ? shuffle(WORDS.filter(x=>x.long)) : shuffle(WORDS);
  show("game"); nextWord();
}

function nextWord(){
  if(idx >= queue.length) return finish();
  const item = queue[idx]; built = []; used = []; tries = 0;
  $("roundInfo").textContent = "Word " + (idx+1) + " of " + queue.length;
  $("feedback").textContent = "";
  $("answer").textContent = "";
  if(mode === "squish"){
    $("prompt").textContent = item.long;
    $("hint").textContent = "Squish these two words into one!";
    $("hearBtn").classList.add("hide");
  } else {
    $("prompt").textContent = "🎧";
    $("hint").textContent = "Tap 🔊 to hear the word.";
    $("hearBtn").classList.remove("hide");
    setTimeout(()=>speak(item.say), 300);
  }
  // tiles: the word's letters + an apostrophe tile always (so "their" is a real choice)
  let letters = item.w.split("").filter(c=>c!=="'");
  letters.push("'");
  if(!item.w.includes("'")) {} // their: apostrophe is a decoy
  const tiles = shuffle(letters.map((c,i)=>({c,i})));
  $("tiles").innerHTML = "";
  tiles.forEach(t=>{
    const b=document.createElement("button");
    b.className="tile"+(t.c==="'"?" apos":"");
    b.textContent=t.c; b.dataset.k=t.i;
    b.onclick=()=>{ built.push(t.c); used.push(b); b.disabled=true; $("answer").textContent=built.join(""); };
    $("tiles").appendChild(b);
  });
}
function undo(){ if(!built.length) return; built.pop(); const b=used.pop(); b.disabled=false; $("answer").textContent=built.join(""); }
function sayCurrent(){ speak(queue[idx].say); }

function check(){
  const item = queue[idx], guess = built.join("");
  const ans = $("answer");
  if(guess === item.w){
    tries === 0 ? score++ : null; drawStars();
    $("feedback").textContent = ["🎉 YES!","🌟 Super speller!","🦄 Amazing!","💥 Nailed it!"][Math.floor(Math.random()*4)];
    ans.classList.remove("pop"); void ans.offsetWidth; ans.classList.add("pop");
    let msg = item.long ? item.w + " means " + item.long : "their, no squish! Great job";
    speak(msg);
    idx++; setTimeout(nextWord, 1700);
  } else {
    tries++;
    ans.classList.remove("shake"); void ans.offsetWidth; ans.classList.add("shake");
    let tip = "Try again!";
    if(!item.w.includes("'") && guess.includes("'")) tip = "Trap word! THEIR has no squish 🚫";
    else if(item.w.includes("'") && guess.replace("'","") === item.w.replace("'","")) tip = "Right letters! Move the squish to where the " + item.out + " got squished out.";
    else if(tries >= 2) tip = "Peek: " + item.w;
    $("feedback").textContent = tip;
  }
}

function buildTrapRound(){ return WORDS.slice(); }
function nextTrap(){
  if(idx >= queue.length) return finish();
  const it = queue[idx];
  $("trapInfo").textContent = "Word " + (idx+1) + " of " + queue.length;
  $("trapWord").textContent = it.w.replace("'", "");
  $("trapFeedback").textContent = "";
  speak(it.w.replace("'", "") === "their" ? "their" : it.w);
}
function trapAnswer(saidSquish){
  const it = queue[idx];
  const shouldSquish = it.w.includes("'");
  if(saidSquish === shouldSquish){
    score++; drawStars();
    $("trapFeedback").textContent = shouldSquish ? "🍪 Yes! It's spelled " + it.w : "🚫 Right! " + it.w + " has no squish!";
  } else {
    $("trapFeedback").textContent = "Oops! It's spelled " + it.w;
  }
  idx++; setTimeout(nextTrap, 1900);
}

function finish(){
  show("done");
  const total = queue.length;
  $("doneScore").textContent = "⭐ " + score + " out of " + total + " ⭐";
  const key = "squish-best-" + mode;
  const best = Math.max(score, +(localStorage.getItem(key)||0));
  localStorage.setItem(key, best);
  $("bestScore").textContent = "Your best score: " + best + ". Can you beat it tomorrow?";
  speak(score === total ? "Perfect score! You are a spelling superstar!" : "Great job! You got " + score + " stars!");
}
</script>
</body>
</html>
